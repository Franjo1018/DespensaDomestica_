plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.despensadomestica'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.despensadomestica"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    // Íconos extendidos de Material: AddAPhoto no viene en el set básico que
    // ya incluye material3 (ese solo trae unos pocos, como Edit y Delete).
    implementation "androidx.compose.material:material-icons-extended"
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences

    // Firebase: BOM fija las versiones de todos los módulos de Firebase entre sí.
    // Desde el BOM 34.0.0 (julio 2025) Firebase dejó de publicar los módulos
    // "-ktx": las extensiones de Kotlin (await(), Firebase.auth, etc.) ya
    // vienen incluidas en los módulos base, así que se usan sin ese sufijo.
    implementation platform(libs.firebase.bom)
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    // No se usa firebase-storage-ktx: requiere el plan de pago Blaze. Las
    // fotos se comprimen y se guardan como texto Base64 dentro del propio
    // producto (Room y Firestore), sin necesidad de un bucket de Storage.

    // Permite usar Task.await() de Firebase dentro de coroutines (viewModelScope).
    implementation libs.kotlinx.coroutines.play.services

    // Coil: muestra la vista previa local de la foto recién elegida (antes de comprimirla).
    implementation libs.coil.compose
}
